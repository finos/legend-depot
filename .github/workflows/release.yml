name: Release

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  CI_GPG_PASSPHRASE: ${{ secrets.CI_GPG_PASSPHRASE }}
  DOCKER_USERNAME: finos
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  MAVEN_OPTS: -Xmx4g

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "New release version"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.FINOS_GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "37706051+finos-admin@users.noreply.github.com"
          git config --global user.name "FINOS Administrator"

      - name: Check release version is unused
        env:
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
          TAG: ${{ github.event.repository.name }}-${{ github.event.inputs.releaseVersion }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::releaseVersion must be MAJOR.MINOR.PATCH; got '${RELEASE_VERSION}'."
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists; ${RELEASE_VERSION} has been released."
            exit 1
          fi

      - name: Set up Maven Central
        uses: actions/setup-java@v2
        with:
          distribution: "zulu"
          java-version: "17"
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD
          gpg-private-key: ${{ secrets.CI_GPG_PRIVATE_KEY }}
          gpg-passphrase: CI_GPG_PASSPHRASE

      - name: Set up Maven
        # Pinned below 3.10, whatever the runner image ships. Maven 3.10 moved
        # to Resolver 2, and central-publishing-maven-plugin (0.7.0 through
        # 0.11.0) cannot bundle under it: the plugin stages through Maven's
        # installer and then deletes only maven-metadata-central-staging.xml,
        # but Resolver 2 stages maven-metadata-local.xml, _remote.repositories
        # and .locks/ instead. All of it lands in the bundle, and Maven Central
        # rejects it with "Bundle has content that does NOT have a .pom file".
        # Every mvn call below runs on this Maven, so the deploy does too.
        env:
          MAVEN_VERSION: 3.9.16
          MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL -o "${archive}" "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA512}  ${archive}" | sha512sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v1
        with:
          theme: dark

      - name: Build and deploy release
        env:
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
        run: mvn -B -e -Drevision="${RELEASE_VERSION}" deploy -P release,docker

      - name: Create and push git tag
        env:
          TAG: ${{ github.event.repository.name }}-${{ github.event.inputs.releaseVersion }}
        run: |
          set -euo pipefail
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Compute and set next SNAPSHOT
        env:
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<< "${RELEASE_VERSION}"
          nextSnapshot="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          sed -i "s|<revision>.*</revision>|<revision>${nextSnapshot}</revision>|" pom.xml
          git add pom.xml
          git commit -m "Bump version to ${nextSnapshot}"
          git push origin "${GITHUB_REF_NAME}"
